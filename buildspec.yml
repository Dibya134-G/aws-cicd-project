 version: 0.2

  phases:
    install:
      runtime-versions:
        nodejs: 18
      commands:
        - echo Installing dependencies...
        - npm install
    build:
      commands:
        - echo Running tests...
        - npm test
        - echo Building application...
        - npm run build
  artifacts:
    files:
      - '**/*'
    base-directory: 'build'
